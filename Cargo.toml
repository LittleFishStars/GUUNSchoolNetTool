[package]
name = "guunnet"
version = "1.2.0"
description = "赣南师范大学校园网自动登录工具（Rust + egui 跨平台版）"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
base64 = "0.23.1"
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
percent-encoding = "2.3.2"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"

[target."cfg(windows)".dependencies]
image = { version = "0.25.10", default-features = false, features = ["ico"] }
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
